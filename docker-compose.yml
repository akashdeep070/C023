# nginx in front of two identical app containers, as on the architecture slide.
# Both apps share one volume, so files and the SQLite database are the same everywhere.
services:
  app1:
    build: .
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      INSTANCE_NAME: app1
      SEED_DEMO: "1"
    volumes: [lexdata:/data]

  app2:
    build: .
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      INSTANCE_NAME: app2
      SEED_DEMO: "0"
    volumes: [lexdata:/data]
    depends_on:
      app1:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports: ["80:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app1, app2]

volumes:
  lexdata:
